
name: Pipeline CI/CD - MVP Distribución de Agua

on:
  push:
    branches: [main, testing, 'fix/bug100-qa-ainelyn', 'test/bug100-fallo-controlado']
  pull_request:
    branches: [main, testing, 'fix/bug100-qa-ainelyn']


jobs:
  build-and-test:
    name: Validaciones Automáticas y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias del Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Validar TypeScript y Compilar Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Ejecutar Pruebas Unitarias (QA)
        working-directory: ./frontend
        run: npm run test:unit

  deploy-to-staging:
    name: Despliegue Automático a Entorno de Pruebas
    needs: build-and-test
    if: github.ref == 'refs/heads/testing' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Aprobado
        uses: actions/checkout@v4

      - name: Desplegar en Servidor de Pruebas (Staging)
        env:
            WEBPAY_COMMERCE_CODE: ${{ vars.WEBPAY_COMMERCE_CODE }}
            WHATSAPP_MOCK_TOKEN: ${{ secrets.WHATSAPP_MOCK_TOKEN }}
        run: |
          echo "Desplegando MVP de Agua Purificada en el entorno de pruebas..."
          echo "Simulación de despliegue en staging completada."
